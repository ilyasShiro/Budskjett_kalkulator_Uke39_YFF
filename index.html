<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min økonomi</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Min økonomi</h1>

    <section>
        <h2>Inntekt</h2>

        <input id="incomeName" placeholder="Navn">
        
        <select id="incomeType">
            <option>Lønn</option>
            <option>Stipend</option>
            <option>Annet</option>
        </select>

        <input id="incomeAmount" type="number" placeholder="Beløp">

        <button onclick="addIncome()">Legg til</button>
    </section>


    <section>
        <h2>Utgift</h2>

        <input id="expenseName" placeholder="Navn">

        <select id="expenseType">
            <option>Mat</option>
            <option>Bolig</option>
            <option>Transport</option>
            <option>Fritid</option>
            <option>Lån</option>
            <option>Annet</option>
        </select>

        <input id="expenseAmount" type="number" placeholder="Beløp">

        <button onclick="addExpense()">Legg til</button>
    </section>


    <section>
        <h2>Oversikt</h2>

        <p>Inntekter: <span id="incomeTotal">0 kr</span></p>
        <p>Utgifter: <span id="expenseTotal">0 kr</span></p>
        <p>Saldo: <span id="balance">0 kr</span></p>

        <ul id="list"></ul>

        <button onclick="window.print()">Skriv ut</button>
    </section>

    <script src="script.js"></script>
</body>
</html>
